<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Department Review · Oxygen Care</title>
    <link rel="stylesheet" href="/calendar.css" />
    <style>
      body {
        margin: 0;
        background: #effbff;
        color: #183f4b;
        font:
          16px system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      .app {
        max-width: 760px;
        margin: auto;
        min-height: 100vh;
        background: #fff;
        padding: 20px;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #cfeaf2;
        padding-bottom: 14px;
      }
      .bar img {
        width: 136px;
      }
      .card {
        border: 1px solid #cfeaf2;
        border-radius: 16px;
        padding: 16px;
        margin-top: 18px;
      }
      .expense {
        padding: 14px 0;
        border-bottom: 1px solid #e8f2f5;
        cursor: pointer;
      }
      .expense:hover,
      .expense:focus {
        background: #f7fcfd;
        outline: none;
      }
      .meta {
        font-size: 13px;
        color: #63818a;
      }
      .actions,
      .filters {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      button,
      a,
      select,
      input {
        padding: 8px;
        border: 1px solid #cfeaf2;
        background: #fff;
        border-radius: 8px;
        color: #277b91;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }
      .receipt {
        display: inline-block;
        font-size: 13px;
        margin-top: 8px;
      }
      .history {
        margin-top: 12px;
        border-left: 3px solid #cfeaf2;
        padding-left: 10px;
      }
      .history summary {
        cursor: pointer;
        color: #277b91;
        font-size: 13px;
        font-weight: 700;
      }
      .history-item {
        font-size: 13px;
        padding: 7px 0;
        border-bottom: 1px solid #eef5f7;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: #183f4b99;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .modal-box {
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        width: min(100%, 420px);
        box-shadow: 0 18px 45px #183f4b55;
      }
      .modal-box h2 {
        margin-top: 0;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 110px;
        margin: 10px 0;
        padding: 10px;
        border: 1px solid #9bcbd9;
        border-radius: 8px;
        font: inherit;
      }
      .error {
        color: #a5412e;
      }
    </style>
    <link rel="stylesheet" href="/mobile.css" />
  </head>
  <body>
    <main class="app">
      <header class="bar">
        <img src="/oxygen-care-logo-supplied.jpeg" alt="Oxygen Care" /><a id="back" href="/"
          >Back</a
        >
      </header>
      <section class="card">
        <h1 id="title">Review expenses</h1>
        <div class="filters">
          <label>From <input id="from" type="date" /></label
          ><label>To <input id="to" type="date" /></label
          ><label
            >Status
            <select id="status">
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="all">All statuses</option>
              <option value="declined">Declined</option>
              <option value="question">Questioned</option>
            </select></label
          >
        </div>
        <div id="count" class="meta"></div>
      </section>
      <section id="content" class="card">Loading expenses…</section>
    </main>
    <script>
      window.reviewConfig = {
        role: 'department_head',
        review: 'head',
        subjectLabel: 'employee',
        allowDelete: false,
        titleElement: 'title',
        titleTag: 'strong',
        titleClass: '',
        flagClass: 'meta',
        actionsClass: 'actions',
        accessError: 'Department Head access is required.',
        userError: 'Employee is not in your department.'
      };
    </script>
    <script src="/http.js"></script>
    <script src="/expense-calendar.js"></script>
    <script src="/review-common.js"></script>
  </body>
</html>
